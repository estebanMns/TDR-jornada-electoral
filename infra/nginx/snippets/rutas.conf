# Rutas comunes (local y producción). Upstream `preconteo` = round-robin SIN afinidad.

# --- SSE (público de Evelyn y tablero de operación) ---
location ~ ^/api/(publico|ops)/stream$ {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# --- WebSocket (consola de verificación) ---
location /ws/ {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Upgrade    $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# --- Estáticos de Next: inmutables (llevan hash en el nombre) ---
location /_next/static/ {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# --- Páginas y API JSON ---
location / {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  proxy_read_timeout 30s;
}
