# Rutas comunes (local y producción). Upstream `preconteo` = round-robin SIN afinidad.

# --- SSE (público de Evelyn y tablero de operación) ---
location ~ ^/api/(publico|ops)/stream$ {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# --- WebSocket (consola de verificación) ---
location /ws/ {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Upgrade    $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# --- Actas (Jose): servicio de ingesta (upstream `actas`, también sin afinidad) ---
location ~ ^/api/actas(/|$) {
  proxy_pass http://actas;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  client_max_body_size 1m; # fotos de actas: máximo 400 KB
  proxy_read_timeout 30s;
}

# --- App del jurado (PWA estática, build de apps/jurado dentro de la imagen de nginx) ---
location = /jurado {
  # Relative Location: keeps the public host and port (nginx would use its internal port 80).
  absolute_redirect off;
  return 301 /jurado/;
}
location /jurado/ {
  root /usr/share/nginx;
  try_files $uri $uri/ /jurado/index.html;

  # El service worker y el HTML deben revalidarse para que las actualizaciones lleguen.
  location ~ ^/jurado/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
  location /jurado/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

# --- Estáticos de Next: inmutables (llevan hash en el nombre) ---
location /_next/static/ {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# --- Páginas y API JSON ---
location / {
  proxy_pass http://preconteo;
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  proxy_read_timeout 30s;
}
