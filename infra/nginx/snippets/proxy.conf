# Cabeceras hacia las instancias. Se incluye DENTRO de cada location porque en nginx
# un proxy_set_header en la location anula todos los heredados del server.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;   # la usa el rate-limit por IP
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
