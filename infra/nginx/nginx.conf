# nginx principal. Los bloques server/upstream salen de templates/ (envsubst de la imagen oficial).
worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 65535;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;
  keepalive_timeout 65s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # text/event-stream NO se comprime: el buffer de gzip retrasaría los eventos.

  log_format preconteo '$remote_addr "$request" $status $body_bytes_sent '
                       'upstream=$upstream_addr inst=$upstream_http_x_instance rt=$request_time';
  access_log /var/log/nginx/access.log preconteo buffer=64k flush=5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  include /etc/nginx/conf.d/*.conf;
}
