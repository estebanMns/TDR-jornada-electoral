# Redis del preconteo (GENERAL §2, §13). La contraseña llega por --requirepass desde .env.

# Persistencia: AOF cada segundo (máximo ~1 s de pérdida ante un corte de la VM).
appendonly yes
appendfsync everysec
save ""

# Nunca expulsar claves: perder un lock, un recibo de idempotencia o un acumulado
# sería un error silencioso. Si se llena, Redis rechaza escrituras y la app lo
# reporta como degradado (fallo explícito).
maxmemory 1gb
maxmemory-policy noeviction

maxclients 10000
tcp-keepalive 60
timeout 0
